"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = "$username$hostname$directory$git_branch$git_status$character"

[username]
show_always = true
format = "[$user]($style)"
style_user = "green"

[hostname]
ssh_only = false
format = "@[$hostname](blue):"

[directory]
truncation_length = 0
format = "[$path](cyan)"

[git_branch]
format = " on [$branch](purple)"

[git_status]
format = " [$all_status$ahead_behind](red)"

[character]
success_symbol = "[\\$](white)"
error_symbol = "[\\$](red) "
